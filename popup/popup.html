<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Plus Bot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Ticket Plus Bot</h1>
      <p id="status">狀態讀取中...</p>
      <div class="actions">
        <button id="startBtn" class="start">啟動</button>
        <button id="stopBtn" class="stop">暫停</button>
      </div>
      <section class="manual-actions">
        <div class="log-title">Manual</div>
        <label for="areaKeyword" class="keyword-label">票區關鍵字</label>
        <input id="areaKeyword" class="keyword-input" type="text" value="2F VIP2（座席）" />
        <div class="manual-grid">
          <button id="refreshOnceBtn" class="manual">點更新票數</button>
          <button id="vip2Btn" class="manual">依關鍵字點票區</button>
          <button id="comboBtn" class="manual">更新後點關鍵字票區</button>
        </div>
      </section>
      <section class="log-wrap">
        <div class="log-title">Log</div>
        <pre id="logBox" class="log-box">尚無資料</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
