<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Plus Bot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Ticket Plus Bot</h1>
      <p id="status">狀態讀取中...</p>
      <p id="scheduleStatus">排程狀態讀取中...</p>
      <div class="actions">
        <button id="startBtn" class="start">啟動</button>
        <button id="stopBtn" class="stop">暫停</button>
      </div>
      <section class="manual-actions">
        <div class="log-title">Manual</div>
        <div class="area-actions">
          <button id="reloadAreasBtn" class="manual">讀取票區清單</button>
          <button id="selectAllAreasBtn" class="manual secondary">全選</button>
          <button id="clearAllAreasBtn" class="manual secondary">取消全選</button>
        </div>
        <div id="areaList" class="area-list">尚未讀取票區</div>
        <section class="flow-settings">
          <label for="ticketCount" class="keyword-label">幾張票</label>
          <input id="ticketCount" class="keyword-input" type="number" min="0" max="4" step="1" value="1" />
          <label for="exclusiveCode" class="keyword-label">專屬碼／優先購票碼</label>
          <input
            id="exclusiveCode"
            class="keyword-input"
            type="text"
            autocomplete="off"
            placeholder="例如 BIGBANG V.I.P MEMBERSHIP PRESALE序號"
          />
          <label for="refreshToAreaDelaySec" class="keyword-label">點擊更新票數 delay 秒數</label>
          <input id="refreshToAreaDelaySec" class="keyword-input" type="number" min="0" step="0.1" value="1.5" />
          <label for="areaToPlusDelaySec" class="keyword-label">選區後延遲幾秒按\+</label>
          <input id="areaToPlusDelaySec" class="keyword-input" type="number" min="0" step="0.1" value="0.3" />
          <label for="areaOrderMode" class="keyword-label">選擇順序</label>
          <select id="areaOrderMode" class="keyword-input">
            <option value="top_to_bottom">top to bottom</option>
            <option value="bottom_to_top">bottom to top</option>
            <option value="middle">middle</option>
            <option value="random">random</option>
          </select>
        </section>
        <section class="flow-settings">
          <label class="keyword-label">每日自動啟動時間</label>
          <div class="schedule-time-row">
            <input id="scheduleStartHour" class="keyword-input schedule-time-part" type="number" min="0" max="23" step="1" value="11" />
            <span class="schedule-time-sep">:</span>
            <input id="scheduleStartMinute" class="keyword-input schedule-time-part" type="number" min="0" max="59" step="1" value="00" />
            <span class="schedule-time-sep">:</span>
            <input id="scheduleStartSecond" class="keyword-input schedule-time-part" type="number" min="0" max="59" step="1" value="01" />
          </div>
          <label class="keyword-label">每日自動暫停時間</label>
          <div class="schedule-time-row">
            <input id="scheduleStopHour" class="keyword-input schedule-time-part" type="number" min="0" max="23" step="1" value="11" />
            <span class="schedule-time-sep">:</span>
            <input id="scheduleStopMinute" class="keyword-input schedule-time-part" type="number" min="0" max="59" step="1" value="01" />
            <span class="schedule-time-sep">:</span>
            <input id="scheduleStopSecond" class="keyword-input schedule-time-part" type="number" min="0" max="59" step="1" value="00" />
          </div>
          <p class="time-hint">使用 24 小時制，可直接輸入或按上下調整，例如 12:00:00 代表中午 12 點。</p>
          <button id="saveScheduleBtn" class="manual">儲存並排程</button>
          <button id="stopScheduleBtn" class="stop">停止排程</button>
        </section>
        <section class="flow-settings">
          <label class="keyword-label">
            <input id="externalTriggerEnabled" type="checkbox" />
            啟用外部 HTTP 觸發
          </label>
          <label for="externalTriggerUrl" class="keyword-label">觸發 URL</label>
          <input
            id="externalTriggerUrl"
            class="keyword-input"
            type="text"
            value="http://127.0.0.1:16888/trigger"
            placeholder="http://127.0.0.1:16888/trigger"
          />
          <label for="externalTriggerMethod" class="keyword-label">請求方法</label>
          <select id="externalTriggerMethod" class="keyword-input">
            <option value="GET">GET</option>
            <option value="POST">POST</option>
          </select>
          <label for="externalTriggerIntervalSec" class="keyword-label">輪詢秒數</label>
          <input id="externalTriggerIntervalSec" class="keyword-input" type="number" min="0.5" step="0.5" value="1" />
          <button id="saveExternalTriggerBtn" class="manual">儲存外部觸發設定</button>
          <button id="testExternalTriggerBtn" class="manual secondary">立即測試外部觸發</button>
          <p id="externalTriggerStatus">外部觸發未啟用</p>
        </section>
      </section>
      <section class="log-wrap">
        <div class="log-title">Log</div>
        <div class="log-filters">
          <label class="keyword-label inline-check">
            <input id="logFilterSuccess" type="checkbox" checked />
            成功
          </label>
          <label class="keyword-label inline-check">
            <input id="logFilterTicket" type="checkbox" checked />
            票況
          </label>
          <label class="keyword-label inline-check">
            <input id="logFilterError" type="checkbox" checked />
            失敗
          </label>
          <label class="keyword-label inline-check">
            <input id="logFilterScan" type="checkbox" />
            掃描細節
          </label>
          <label class="keyword-label inline-check">
            <input id="logFilterSystem" type="checkbox" checked />
            系統
          </label>
        </div>
        <label class="keyword-label">
          <input id="autoScrollLog" type="checkbox" checked />
          自動捲動 Log
        </label>
        <pre id="logBox" class="log-box">尚無資料</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
