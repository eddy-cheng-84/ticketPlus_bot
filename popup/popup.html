<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Plus Bot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Ticket Plus Bot</h1>
      <p id="status">狀態讀取中...</p>
      <div class="actions">
        <button id="startBtn" class="start">啟動</button>
        <button id="stopBtn" class="stop">暫停</button>
      </div>
      <section class="manual-actions">
        <div class="log-title">Manual</div>
        <div class="area-actions">
          <button id="reloadAreasBtn" class="manual">讀取票區清單</button>
        </div>
        <div id="areaList" class="area-list">尚未讀取票區</div>
        <section class="flow-settings">
          <label for="ticketCount" class="keyword-label">幾張票</label>
          <input id="ticketCount" class="keyword-input" type="number" min="0" max="4" step="1" value="1" />
          <label for="refreshToAreaDelaySec" class="keyword-label">重新整理秒數</label>
          <input id="refreshToAreaDelaySec" class="keyword-input" type="number" min="0" step="0.1" value="1" />
          <label for="areaToPlusDelaySec" class="keyword-label">選區後延遲幾秒按\+</label>
          <input id="areaToPlusDelaySec" class="keyword-input" type="number" min="0" step="0.1" value="0.2" />
          <label for="areaOrderMode" class="keyword-label">選擇順序</label>
          <select id="areaOrderMode" class="keyword-input">
            <option value="top_to_bottom">top to bottom</option>
            <option value="bottom_to_top">bottom to top</option>
            <option value="middle">middle</option>
            <option value="random">random</option>
          </select>
        </section>
        <section class="flow-settings">
          <label for="scheduleStartTime" class="keyword-label">每日自動啟動時間</label>
          <input id="scheduleStartTime" class="keyword-input" type="time" step="1" value="11:00:01" />
          <label for="scheduleStopTime" class="keyword-label">每日自動暫停時間</label>
          <input id="scheduleStopTime" class="keyword-input" type="time" step="1" value="11:01:00" />
          <button id="saveScheduleBtn" class="manual">儲存並排程</button>
          <button id="stopScheduleBtn" class="stop">停止排程</button>
        </section>
      </section>
      <section class="log-wrap">
        <div class="log-title">Log</div>
        <pre id="logBox" class="log-box">尚無資料</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
