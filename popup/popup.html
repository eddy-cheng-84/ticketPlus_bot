<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ticket Plus Bot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Ticket Plus Bot</h1>
      <p id="status">狀態讀取中...</p>
      <div class="actions">
        <button id="startBtn" class="start">啟動</button>
        <button id="stopBtn" class="stop">暫停</button>
      </div>
      <section class="manual-actions">
        <div class="log-title">Manual</div>
        <div class="area-actions">
          <button id="reloadAreasBtn" class="manual">讀取票區清單</button>
        </div>
        <div id="areaList" class="area-list">尚未讀取票區</div>
        <section class="flow-settings">
          <label for="ticketCount" class="keyword-label">幾張票</label>
          <input id="ticketCount" class="keyword-input" type="number" min="0" max="4" step="1" value="1" />
          <label for="areaToPlusDelaySec" class="keyword-label">選區後延遲秒數</label>
          <input id="areaToPlusDelaySec" class="keyword-input" type="number" min="0" step="0.1" value="0" />
          <label for="areaOrderMode" class="keyword-label">選擇順序</label>
          <select id="areaOrderMode" class="keyword-input">
            <option value="top_to_bottom">top to bottom</option>
            <option value="bottom_to_top">bottom to top</option>
            <option value="middle">middle</option>
            <option value="random">random</option>
          </select>
          <button id="runFlowBtn" class="manual">一鍵執行流程</button>
        </section>
        <label for="areaKeyword" class="keyword-label">單次手動關鍵字</label>
        <input id="areaKeyword" class="keyword-input" type="text" value="" placeholder="可留空" />
        <div class="manual-grid">
          <button id="refreshOnceBtn" class="manual">點更新票數</button>
          <button id="vip2Btn" class="manual">依關鍵字點票區</button>
          <button id="comboBtn" class="manual">更新後點關鍵字票區</button>
          <button id="plusBtn" class="manual">點 + 號</button>
          <button id="nextStepBtn" class="manual">點下一步</button>
        </div>
      </section>
      <section class="log-wrap">
        <div class="log-title">Log</div>
        <pre id="logBox" class="log-box">尚無資料</pre>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
